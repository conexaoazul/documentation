name: Blue Docs Immutable Image

on:
  pull_request:
    branches:
      - "19.0"
  push:
    branches:
      - "19.0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: blue-docs-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.blue-docs
          load: true
          push: false
          tags: blue-docs:validation
          build-args: |
            SOURCE_SHA=${{ github.sha }}

      - name: Validate health, index and attribution
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run -d --rm --name blue-docs-validation -p 18080:8080 blue-docs:validation
          trap 'docker stop blue-docs-validation >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz | grep -Fq ok; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:18080/healthz | grep -Fq ok
          curl --fail --silent http://127.0.0.1:18080/index.html | grep -Eiq '<html|<!doctype'
          curl --fail --silent http://127.0.0.1:18080/BLUE_SOURCE.txt | grep -Fq 'License: CC-BY-SA-4.0'

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/19.0'
    needs: validate-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.blue-docs
          push: true
          build-args: |
            SOURCE_SHA=${{ github.sha }}
          tags: |
            ghcr.io/conexaoazul/odoo-documentation:19.0-${{ github.sha }}
            ghcr.io/conexaoazul/odoo-documentation:19.0
