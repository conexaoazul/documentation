name: Blue Docs Immutable Image

on:
  pull_request:
    branches:
      - "19.0"
  push:
    branches:
      - "19.0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: blue-docs-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          show-progress: false

      - name: Build validation image with concise diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG_FILE="${RUNNER_TEMP}/blue-docs-build.log"

          set +e
          docker build \
            --file Dockerfile.blue-docs \
            --build-arg "SOURCE_SHA=${GITHUB_SHA}" \
            --tag blue-docs:validation \
            . >"${LOG_FILE}" 2>&1
          RC=$?
          set -e

          if [ "${RC}" -ne 0 ]; then
            echo "::error::Blue documentation image build failed"
            tail -160 "${LOG_FILE}"
            exit "${RC}"
          fi

          tail -30 "${LOG_FILE}"

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blue-docs-build-log
          path: ${{ runner.temp }}/blue-docs-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Validate health, index and attribution
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run -d --rm --name blue-docs-validation -p 18080:8080 blue-docs:validation
          trap 'docker stop blue-docs-validation >/dev/null 2>&1 || true' EXIT

          HEALTH_FILE="${RUNNER_TEMP}/blue-docs-health.txt"
          INDEX_FILE="${RUNNER_TEMP}/blue-docs-index.html"
          SOURCE_FILE="${RUNNER_TEMP}/blue-docs-source.txt"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --output "${HEALTH_FILE}" \
              http://127.0.0.1:18080/healthz; then
              break
            fi
            sleep 1
          done

          grep -Fq ok "${HEALTH_FILE}"
          curl --fail --silent --show-error \
            --output "${INDEX_FILE}" \
            http://127.0.0.1:18080/index.html
          grep -Eiq '<html|<!doctype' "${INDEX_FILE}"

          curl --fail --silent --show-error \
            --output "${SOURCE_FILE}" \
            http://127.0.0.1:18080/BLUE_SOURCE.txt
          grep -Fq 'License: CC-BY-SA-4.0' "${SOURCE_FILE}"
          grep -Fq "Commit: ${GITHUB_SHA}" "${SOURCE_FILE}"

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/19.0'
    needs: validate-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.blue-docs
          push: true
          build-args: |
            SOURCE_SHA=${{ github.sha }}
          tags: |
            ghcr.io/conexaoazul/odoo-documentation:19.0-${{ github.sha }}
            ghcr.io/conexaoazul/odoo-documentation:19.0
