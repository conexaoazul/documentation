name: Deploy docs ERP to dev1

on:
  workflow_dispatch:
    inputs:
      image:
        description: Immutable GHCR image tag to deploy
        required: false
        default: "ghcr.io/conexaoazul/odoo-documentation:19.0"

permissions:
  contents: read
  packages: read

concurrency:
  group: docs-erp-dev1
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, dev1]
    timeout-minutes: 20
    env:
      DOCS_ERP_PORT: "18081"
      DOCS_ERP_HOST: docs-erp.conexaoazul.com
      DOCS_ERP_IMAGE: ${{ github.event.inputs.image || 'ghcr.io/conexaoazul/odoo-documentation:19.0' }}
    steps:
      - name: Authenticate to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull exact documentation artifact
        run: |
          set -euo pipefail
          docker pull "$DOCS_ERP_IMAGE"
          docker image inspect "$DOCS_ERP_IMAGE" --format '{{json .RepoDigests}}' | tee /tmp/docs-erp-digest.json

      - name: Preserve previous image for rollback
        run: |
          set -euo pipefail
          if docker inspect conexaoazul-docs-erp >/dev/null 2>&1; then
            docker inspect conexaoazul-docs-erp --format '{{.Config.Image}}' > /tmp/docs-erp-previous-image.txt || true
          fi

      - name: Deploy static docs container
        run: |
          set -euo pipefail
          docker rm -f conexaoazul-docs-erp >/dev/null 2>&1 || true
          docker run -d \
            --name conexaoazul-docs-erp \
            --restart unless-stopped \
            -p "127.0.0.1:${DOCS_ERP_PORT}:8080" \
            "$DOCS_ERP_IMAGE"

      - name: Local healthcheck and provenance
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${DOCS_ERP_PORT}/healthz" | grep -Fq ok; then
              break
            fi
            sleep 2
          done
          curl -fsS "http://127.0.0.1:${DOCS_ERP_PORT}/index.html" >/dev/null
          curl -fsS "http://127.0.0.1:${DOCS_ERP_PORT}/BLUE_SOURCE.txt" | tee /tmp/docs-erp-source.txt

      - name: Public URL validation
        run: |
          set -euo pipefail
          if getent hosts "$DOCS_ERP_HOST" >/dev/null 2>&1; then
            curl -fsSI --max-time 15 "https://${DOCS_ERP_HOST}/"
          else
            echo "DNS ${DOCS_ERP_HOST} not present yet; local origin is healthy on 127.0.0.1:${DOCS_ERP_PORT}."
          fi

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## docs-erp dev1"
            echo "- Host: https://${DOCS_ERP_HOST}"
            echo "- Local origin: http://127.0.0.1:${DOCS_ERP_PORT}"
            echo "- Container: conexaoazul-docs-erp"
            echo "- Image: ${DOCS_ERP_IMAGE}"
            if [ -f /tmp/docs-erp-digest.json ]; then echo "- Digest: $(cat /tmp/docs-erp-digest.json)"; fi
            if [ -f /tmp/docs-erp-previous-image.txt ]; then echo "- Previous image: $(cat /tmp/docs-erp-previous-image.txt)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
